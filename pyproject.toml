[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "night-clerk"
version = "0.1.0"
description = "Overnight research-inbox agent that writes evidence receipts."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
authors = [{ name = "ttthkim-hue" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "google-adk>=1.0",
  "google-genai>=1.0",
  "google-cloud-firestore>=2.19",
  "google-cloud-storage>=2.18",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[project.scripts]
night-clerk = "night_clerk.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
